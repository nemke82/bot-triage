<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f9488"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint log lines -->
  <g stroke="#1f2b45" stroke-width="6" stroke-linecap="round">
    <line x1="56" y1="120" x2="104" y2="120"/>
    <line x1="56" y1="150" x2="92" y2="150"/>
    <line x1="56" y1="180" x2="110" y2="180"/>
    <line x1="408" y1="330" x2="456" y2="330"/>
    <line x1="420" y1="360" x2="456" y2="360"/>
    <line x1="402" y1="390" x2="456" y2="390"/>
  </g>

  <!-- shield -->
  <path d="M256 72 L404 124 V246 C404 344 340 414 256 448 C172 414 108 344 108 246 V124 Z"
        fill="#0d1526" stroke="url(#shield)" stroke-width="16" stroke-linejoin="round"/>

  <!-- bot -->
  <line x1="256" y1="176" x2="256" y2="146" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="138" r="13" fill="#2dd4bf"/>
  <rect x="180" y="176" width="152" height="118" rx="32" fill="#e2e8f0"/>
  <rect x="166" y="214" width="16" height="40" rx="8" fill="#cbd5e1"/>
  <rect x="330" y="214" width="16" height="40" rx="8" fill="#cbd5e1"/>
  <circle cx="222" cy="232" r="16" fill="#0d1526"/>
  <circle cx="290" cy="232" r="16" fill="#0d1526"/>
  <rect x="226" y="266" width="60" height="10" rx="5" fill="#94a3b8"/>

  <!-- scan line -->
  <rect x="128" y="226" width="256" height="12" rx="6" fill="url(#scan)" filter="url(#glow)"/>
  <rect x="136" y="229" width="240" height="6" rx="3" fill="url(#scan)"/>

  <!-- traffic histogram, one bad spike -->
  <g>
    <rect x="200" y="350" width="18" height="24" rx="4" fill="#2dd4bf"/>
    <rect x="226" y="338" width="18" height="36" rx="4" fill="#2dd4bf"/>
    <rect x="252" y="314" width="18" height="60" rx="4" fill="#f43f5e"/>
    <rect x="278" y="344" width="18" height="30" rx="4" fill="#2dd4bf"/>
    <rect x="304" y="354" width="18" height="20" rx="4" fill="#2dd4bf"/>
  </g>
</svg>
